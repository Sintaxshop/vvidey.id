<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Video Player</title>
    <style>
        /* Reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Posisi ke tengah layar */
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }

        /* Kontainer Video - Rasio 9:16 */
        .video-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 9 / 16;
            background-color: #000000;
            position: relative;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden; /* Memastikan overlay tidak keluar batas */
        }

        /* Tombol Play Lingkaran Default CSS */
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        /* Segitiga Play (Menggunakan murni CSS border) */
        .play-button::after {
            content: '';
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 15px 0 15px 22px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 6px; /* Menengah kan segitiga secara visual */
        }

        .video-container:hover .play-button {
            transform: translate(-50%, -50%) scale(1.1);
            background-color: rgba(255, 255, 255, 0.4);
        }

        /* -------------------------------------
           OVERLAY & TEKS & TOMBOL REFRESH 
           ------------------------------------- */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9); /* Latar belakang lebih gelap agar teks jelas */
            display: none; /* Disembunyikan secara default */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: default;
        }

        .overlay-text {
            color: #ffffff;
            font-size: 15px;
            text-align: center;
            margin-bottom: 20px;
            padding: 0 20px;
            line-height: 1.5;
        }

        .reload-btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff4d4d;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 77, 77, 0.4);
            transition: background-color 0.2s, transform 0.1s;
        }

        .reload-btn:hover {
            background-color: #ff1a1a;
        }

        .reload-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Fake Video Player -->
    <div class="video-container" id="fakePlayer">
        <div class="play-button"></div>
        
        <!-- Layar Overlay (Muncul setelah klik ke-2) -->
        <div class="overlay" id="reloadOverlay">
            <p class="overlay-text">Sesi berakhir. Refresh halaman ini untuk memuat ulang.</p>
            <button class="reload-btn" id="reloadBtn">Refresh</button>
        </div>
    </div>

    <script>
        const SHOPEE_URL = "https://s.shopee.co.id/2BEnXKTiWZ";
        const STORAGE_KEY = "shopee_click_count";

        // 1. Cek apakah halaman dimuat ulang (Refresh)
        function checkIsReload() {
            const navEntries = performance.getEntriesByType("navigation");
            if (navEntries.length > 0 && navEntries[0].type === "reload") {
                return true;
            } else if (performance.navigation && performance.navigation.type === 1) {
                return true;
            }
            return false;
        }

        // 2. Fungsi untuk menampilkan layar overlay
        function checkAndShowOverlay() {
            let currentClicks = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);
            if (currentClicks >= 2) {
                document.getElementById("reloadOverlay").style.display = "flex";
            }
        }

        // 3. Eksekusi saat pertama dimuat: Reset jika Refresh, atau tampilkan overlay jika bukan Refresh
        if (checkIsReload()) {
            localStorage.removeItem(STORAGE_KEY);
        } else {
            checkAndShowOverlay();
        }

        // 4. Deteksi saat menekan tombol BACK (Kembali dari tab Shopee)
        window.addEventListener("pageshow", function(event) {
            if (event.persisted && !checkIsReload()) {
                checkAndShowOverlay();
            }
        });

        // 5. Tambahan perlindungan: Cek saat user kembali fokus ke tab website ini
        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === 'visible' && !checkIsReload()) {
                checkAndShowOverlay();
            }
        });

        // 6. Logika klik pada area video utama
        document.getElementById("fakePlayer").addEventListener("click", function() {
            let currentClicks = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);

            if (currentClicks < 2) {
                // Tambah jumlah klik
                currentClicks++;
                localStorage.setItem(STORAGE_KEY, currentClicks);
                
                // Redirect ke Shopee
                window.location.href = SHOPEE_URL;
            } else {
                // Tampilkan overlay jika mencoba klik lagi
                checkAndShowOverlay();
            }
        });

        // 7. Logika klik pada background overlay (Mencegah klik diteruskan ke fakePlayer di belakangnya)
        document.getElementById("reloadOverlay").addEventListener("click", function(e) {
            e.stopPropagation(); 
        });

        // 8. Logika klik pada tombol "Refresh"
        document.getElementById("reloadBtn").addEventListener("click", function(e) {
            e.stopPropagation(); // Mencegah klik diteruskan
            window.location.reload(true); // Refresh halaman secara paksa
        });
    </script>
</body>
</html>
